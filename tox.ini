[tox]
minversion = 4.0.2
envlist = py310, py311, py312, lint
skipsdist = True

[testenv]
usedevelop = True
install_command = pip install -U {opts} {packages}
passenv = *
setenv =
  VIRTUAL_ENV={envdir}
  LANGUAGE=en_US
  LC_ALL=en_US.utf-8
  ARGS="-V"
extras = tns,sat,notebooks,test,ci
commands =
  stestr run {posargs}

[testenv:lint]
envdir = .tox/lint
basepython = python3
extras = lint
commands =
  black --check {posargs} qaoa_training_pipeline test
  ruff check qaoa_training_pipeline test

[testenv:black]
envdir = .tox/lint
extras = lint
commands = black {posargs} qaoa_training_pipeline test

[testenv:coverage]
basepython = python3
extras = tns,sat,notebooks,test,ci
setenv =
  {[testenv]setenv}
  PYTHON=coverage3 run --source qaoa_training_pipeline --parallel-mode
commands =
  stestr run {posargs}
  coverage3 combine
  coverage3 report
