[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "qaoa_training_pipeline"
dynamic = ["version"]
description = "QAOA training pipeline"
readme = "README.md"
license = { text = "Apache 2.0" }
authors = [
    { name = "Daniel Egger" },
    { name = "Elena Pena Tapia" },
    { name = "Alberto Baiardi" },
]
keywords = ["qaoa"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "networkx",
    "numpy>=1.22.0",
    "scipy",
    "qiskit",
    "scikit-learn",
    "matplotlib>=3.3",
    "qiskit-optimization",
]

[project.optional-dependencies]
cplex = [
    "qiskit-optimization[cplex]",
]
tns = [
    "quimb>=1.8.2",
    "cotengra<=0.8.1",
    "juliacall",
]
sat = [
    "python-sat",
]
notebooks = [
    "qiskit-aer",
    "qiskit-ibm-runtime",
]
test = [
    "ddt",
]
ci = [
    "stestr>=2.0.0",
    "coverage>=4.4.0",
]
lint = [
    "black[jupyter]~=24.1",
    "ruff",
]
dev = [
    "qaoa_training_pipeline[tns,sat,cplex,notebooks,test,lint]",
    "pre-commit",
]

[tool.uv]
# numba<0.54 has requires-python <3.10 and no wheels for 3.11+; force a modern version.
constraint-dependencies = ["numba>=0.60"]

[tool.setuptools.dynamic]
version = { file = "qaoa_training_pipeline/VERSION.txt" }

[tool.setuptools.packages.find]
include = ["qaoa_training_pipeline", "qaoa_training_pipeline.*"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "C90", "UP", "SIM", "N", "ANN", "D", "ARG", "RUF"]
ignore = [
    # intentional style choices
    "D203",   # conflicts with D211; Black prefers no blank line before class docstring
    "D212",   # conflicts with D211; choose one convention
    "D205",   # allow docstring without a summary line
    "D415",   # Too restrictive: First line should end with a period, question mark, or exclamation point
    "D406",
    "D407",
    "ANN20",  # allows missing return type annotation for functions
    "ANN001", # allow missing type hint for public function
    "B905",   # allow zip() to be called without the strict= parameter
    "E501",   # line too long, black is supposed to handle this so don't complain
    # TODO: pre-existing violations — fix incrementally
    "ANN002", "ANN003", "ANN401",  # missing type annotations on *args/**kwargs; use of Any
    "ARG002", "ARG003",            # unused method / classmethod arguments
    "B008", "B009", "B018", "B028",  # bugbear: mutable defaults, getattr with constant, dead expressions, missing stacklevel
    "C901",                        # functions with too-high McCabe complexity
    "D102", "D105", "D200", "D202", "D209", "D210", "D301", "D400", "D401", "D404", "D411",  # docstring style and coverage
    "I001",                        # unsorted imports
    "N806", "N813",                # naming: non-lowercase variable; CamelCase import aliased to lowercase
    "RUF002", "RUF003", "RUF005", "RUF013", "RUF021", "RUF022",  # ruff: ambiguous unicode, collection concat, implicit Optional, operator parens, unsorted __all__
    "SIM102", "SIM105", "SIM108", "SIM118", "SIM300", "SIM401", "SIM910",  # simplifications: collapsible-if, suppressible-exception, ternary, dict.get, yoda
    "UP006", "UP007", "UP015", "UP034", "UP035", "UP037", "UP045",  # modern Python syntax: built-in generics, X|Y unions, deprecated typing imports
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["qaoa_training_pipeline"]

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = ["D", "ANN", "ARG", "C90", "SIM", "N", "RUF059"]
"**/__init__.py" = ["D104", "F401"]

[tool.pylint.main]
py-version = "3.12"  # update it when bumping minimum supported python version

[tool.pylint.basic]
good-names = ["a", "b", "i", "j", "k", "d", "n", "m", "ex", "v", "w", "x", "y", "z", "Run", "_", "logger", "q", "c", "r", "qr", "cr", "qc", "nd", "pi", "op", "b", "ar", "br", "p", "cp", "ax", "dt", "__unittest", "iSwapGate", "mu"]
method-rgx = "(([a-z_][a-z0-9_]{2,49})|(assert[A-Z][a-zA-Z0-9]{2,43})|(test_[_a-zA-Z0-9]{2,}))$"
variable-rgx = "[a-z_][a-z0-9_]{1,30}$"

[tool.pylint.format]
max-line-length = 105  # default 100

[tool.pylint."messages control"]
disable = [
# intentionally disabled:
    "spelling",  # too noisy
    "fixme", # disabled as TODOs would show up as warnings
    "protected-access", # disabled as we don't follow the public vs private convention strictly
    "duplicate-code", # disabled as it is too verbose
    "redundant-returns-doc", # for @abstractmethod, it cannot interpret "pass"
    "too-many-lines", "too-many-branches", "too-many-locals", "too-many-nested-blocks", "too-many-statements",
    "too-many-instance-attributes", "too-many-arguments", "too-many-public-methods", "too-few-public-methods", "too-many-ancestors",
    "unnecessary-pass", # allow for methods with just "pass", for clarity
    "no-else-return",  # relax "elif" after a clause with a return
    "docstring-first-line-empty", # relax docstring style
    "import-outside-toplevel", "import-error", # overzealous with our optionals/dynamic packages
# TODO(#9614): these were added in modern Pylint. Decide if we want to enable them. If so,
#  remove from here and fix the issues. Else, move it above this section and add a comment
#  with the rationale
    "arguments-renamed",
    "broad-exception-raised",
    "consider-iterating-dictionary",
    "consider-using-dict-items",
    "consider-using-enumerate",
    "consider-using-f-string",
    "modified-iterating-list",
    "nested-min-max",
    "no-member",
    "no-value-for-parameter",
    "non-ascii-name",
    "not-context-manager",
    "superfluous-parens",
    "unknown-option-value",
    "unexpected-keyword-arg",
    "unnecessary-dict-index-lookup",
    "unnecessary-direct-lambda-call",
    "unnecessary-dunder-call",
    "unnecessary-ellipsis",
    "unnecessary-lambda-assignment",
    "unnecessary-list-index-lookup",
    "unspecified-encoding",
    "unsupported-assignment-operation",
    "use-dict-literal",
    "use-list-literal",
    "use-implicit-booleaness-not-comparison",
    "use-maxsplit-arg",
]

enable = [
    "use-symbolic-message-instead"
]

[tool.pylint.spelling]
spelling-private-dict-file = ".pylintdict"
spelling-store-unknown-words = "n"
